[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-ai"
version = "1.0.0"
description = "B站 AI 自动运营完整解决方案"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "lb290", email = "lb290@163.com"}
]
keywords = ["bilibili", "ai", "automation", "content-creation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "bili-agent>=1.0.0",
    "openai>=1.0.0",
    "edge-tts>=7.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
video = [
    "ffmpeg-python>=0.2.0",
]
browser = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
bili-ai = "bili_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bili_ai*"]
